name: Kerit Cloud Auto Renew (Playwright + NopeCHA + sing-box)

on:
  schedule:
    # 每天 UTC 02:00 和 14:00 (北京时间 10:00 和 22:00) 各执行一次
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool curl jq unzip

      - name: 📦 安装 Python 依赖与 Playwright
        run: |
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 🧩 下载并解压 NopeCHA 验证码插件
        run: |
          echo "创建 NopeCHA 插件目录..."
          mkdir -p scripts/extensions/nopecha/unpacked
          echo "下载最新 NopeCHA Chromium 插件..."
          curl -fLo nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          unzip -q -o nopecha.zip -d scripts/extensions/nopecha/unpacked
          echo "NopeCHA 插件已解压就绪 ✅"

      - name: 🌐 配置并启动 sing-box 节点代理
        if: env.NODE_LINK != ''
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          echo "安装 sing-box..."
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.9.7/sing-box-1.9.7-linux-amd64.tar.gz | sudo tar -xz --strip-components=1 -C /usr/local/bin
          echo "解析节点并生成代理配置..."
          python3 setup_proxy.py
          if [ -f "config.json" ]; then
            echo "后台启动 sing-box 代理 (端口 127.0.0.1:7890)..."
            nohup sing-box run -c config.json > sing-box.log 2>&1 &
            sleep 4
            echo "测试代理连通性..."
            curl -s -x http://127.0.0.1:7890 https://api.ip.sb/ip || true
          fi

      - name: 🚀 运行 Kerit Cloud 自动续期
        env:
          KERIT_EMAIL: ${{ secrets.KERIT_EMAIL }}
          KERIT_PASSWORD: ${{ secrets.KERIT_PASSWORD }}
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
          PROXY_URL: 'http://127.0.0.1:7890'
          IS_PROXY: ${{ secrets.NODE_LINK != '' && 'true' || 'false' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_NAME: ${{ secrets.SERVER_NAME || 'Kerit Free Discord Bot' }}
        run: |
          xvfb-run --auto-servernum -s "-screen 0 1366x768x24" python3 renew_kerit.py

      - name: 📸 上传调试截图 (若生成)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerit-screenshots
          path: "*.png"
          if-no-files-found: ignore

      - name: 🧹 清理后台进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
