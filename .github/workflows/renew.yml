name: Kerit Cloud 自动心跳续期

on:
  schedule:
    # 每天北京时间 10:00 和 22:00 各执行一次 (UTC 02:00, 14:00)
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  NODE_LINK:       ${{ secrets.NODE_LINK }}
  KERIT:           ${{ secrets.KERIT }}
  KERIT_EMAIL:     ${{ secrets.KERIT_EMAIL }}
  KERIT_PASSWORD:  ${{ secrets.KERIT_PASSWORD }}
  KERIT_COOKIES:   ${{ secrets.KERIT_COOKIES }}
  TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
  NOPECHA_KEY:     ${{ secrets.NOPECHA_KEY }}
  OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
  OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
  OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}

jobs:
  renew:
    name: Kerit 心跳续期
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 检出私有核心仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/my-private-scripts
          path: scripts
          token: ${{ secrets.CORE_SCRIPT_TOKEN || secrets.REPO_TOKEN || secrets.GH_PAT_PRIVATE_REPO }}

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.job }}-v1
          restore-keys: |
            ${{ runner.os }}-pip-${{ github.job }}-

      - name: 安装系统底层依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-cjk p7zip-full git curl jq

      - name: 安装 Python 库
        run: |
          pip install -q seleniumbase requests playwright opencv-python-headless \
                        msgpack typer matplotlib google-genai httpx \
                        loguru pydantic-settings tenacity pytz

      - name: 安装并配置 ChromeDriver
        run: seleniumbase install chromedriver

      - name: 下载并解压 NopeCHA 扩展
        run: |
          mkdir -p scripts/extensions/nopecha
          wget -q -O scripts/extensions/nopecha/chromium.zip \
            https://github.com/NopeCHALLC/nopecha-extension/releases/download/0.6.1/chromium.zip
          7z x -y scripts/extensions/nopecha/chromium.zip -oscripts/extensions/nopecha/unpacked

      - name: 克隆 hcaptcha-challenger
        run: |
          git clone --depth 1 https://github.com/aoi675145/hcaptcha.git hcaptcha-challenger
          cd hcaptcha-challenger
          git fetch --depth 1 origin d4da375916cde6bb85128eb8fc9859e1f06cacbc \
            && git checkout --detach FETCH_HEAD \
            || echo "[WARN] 固定 commit 获取失败，使用克隆时的 main HEAD"
          git rev-parse HEAD

      - name: 配置并启动 sing-box 节点代理
        run: |
          chmod +x scripts/setup_proxy.sh
          bash scripts/setup_proxy.sh || echo "[INFO] 代理未配置或失败，尝试直连模式"

      - name: 执行 Kerit 心跳续期核心脚本
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" python -u scripts/kerit/main_ai.py

      - name: 同步并持久化最新 Cookie 到私有仓库
        if: always()
        run: |
          cd scripts
          if [ -f "kerit/session.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f kerit/session.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(kerit): 自动持久化最新 30 天 Cookie [skip ci]"
              git push origin main
              echo "✅ 最新会话 Cookie 已成功回写并保存到 my-private-scripts 私有仓库！"
            else
              echo "ℹ️ Cookie 无变化，无需重复提交"
            fi
          fi

      - name: 上传执行截图 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerit-screenshots
          path: screenshots/
          retention-days: 7